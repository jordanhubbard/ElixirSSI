%% TLS options for BEAM distribution (inet_tls_dist). The certificate files
%% are written by SSI.Cluster.TLS at boot, before distribution starts: a node
%% certificate signed by the CA key every node derives from the cluster secret.
[{server, [{certfile, "/run/ssi/tls/node.pem"},
           {keyfile, "/run/ssi/tls/node.key"},
           {cacertfile, "/run/ssi/tls/ca.pem"},
           {verify, verify_peer},
           {fail_if_no_peer_cert, true},
           {versions, ['tlsv1.3']}]},
 {client, [{certfile, "/run/ssi/tls/node.pem"},
           {keyfile, "/run/ssi/tls/node.key"},
           {cacertfile, "/run/ssi/tls/ca.pem"},
           {verify, verify_peer},
           {server_name_indication, disable},
           {versions, ['tlsv1.3']}]}].
